<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>予約システム</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">

<link rel="stylesheet" href="style.css">

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>

<body>

<h2>予約システム</h2>

<div id="name">読み込み中...</div>

<div class="schedule-header">
    <button id="prevWeekButton" type="button">‹</button>
    <div id="scheduleTitle"></div>
    <button id="nextWeekButton" type="button">›</button>
</div>

<div class="schedule-scroll">
    <table id="scheduleTable" class="schedule-table">
        <thead id="scheduleHead"></thead>
        <tbody id="scheduleBody"></tbody>
    </table>
</div>

<div id="selectedReservation" class="selected-reservation"></div>

<button id="reserveButton" type="button">
    予約する
</button>

<button id="reserveButton">予約する</button>

<script src="script.js"></script>

</body>
</html>
